[package]
name = "lunarfetch"
version = "0.1.5"
edition = "2024"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "1.0.97"
byte-unit = "5.1.6"
owo-colors = { version = "4.2.0" }
pci-ids = "0.2.5"
pci-info = "0.3.0"
pretty-duration = "0.1.1"
procfs = "0.17.0"
sys-info = { version = "0.9.1" }
sysinfo = "0.33.1"
tokio = { version = "1.44.0", features = ["full"] }
uname = { version = "0.1.1" }
uptime_lib = "0.3.1"
zbus = { version = "5.5.0", features = ["tokio"] }
zvariant = "5.4.0"
